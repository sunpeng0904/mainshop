server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: online-mall

  # 国际化配置
  messages:
    basename: i18n/messages,i18n/ValidationMessages
    encoding: UTF-8
    use-code-as-default-message: true

  # 数据库配置（MySQL）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/online_mall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5

  # SQL初始化配置
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

  # H2控制台（已禁用）
  h2:
    console:
      enabled: false
  
  # Redis配置（可选）
  redis:
    host: 127.0.0.1
    port: 6379
    password: 
    database: 0
    timeout: 3000
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      enabled: true

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 应用配置
app:
  # JWT配置
  jwt:
    secret: online-mall-secret-key-2025-04-07-this-is-a-very-secure-key-for-jwt-hs512-algorithm
    expiration: 86400000  # 24小时
    header: Authorization
  
  # 文件存储路径
  file:
    upload-path: ./uploads/
    access-path: /uploads/**

  # 图片缓存配置
  image:
    cache-path: ./uploads/cache/
    products-path: ./src/main/resources/static/images/products/
  
# 跨域配置（在代码中通过@CrossOrigin或WebMvcConfigurer配置）
# cors配置已移除，将在代码中配置

# 日志配置
logging:
  level:
    com.online.mall: debug
    org.springframework.security: debug
  file:
    name: logs/online-mall.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha