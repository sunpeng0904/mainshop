<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" rx="12" fill="url(#bg)"/>

  <!-- Border accent -->
  <rect x="2" y="2" width="396" height="196" rx="10" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>

  <!-- AI Brain Icon -->
  <g transform="translate(50, 45)" filter="url(#glow)">
    <!-- Brain outline -->
    <path d="M35 10 C15 10, 0 25, 0 45 C0 55, 5 65, 15 70 C10 75, 10 85, 20 90 C25 95, 35 95, 40 90 C45 95, 55 95, 60 90 C70 85, 70 75, 65 70 C75 65, 80 55, 80 45 C80 25, 65 10, 45 10 Z"
          fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>

    <!-- Neural connections -->
    <circle cx="25" cy="35" r="4" fill="url(#node)" opacity="0.9"/>
    <circle cx="55" cy="35" r="4" fill="url(#node)" opacity="0.9"/>
    <circle cx="20" cy="55" r="4" fill="url(#node)" opacity="0.9"/>
    <circle cx="60" cy="55" r="4" fill="url(#node)" opacity="0.9"/>
    <circle cx="35" cy="45" r="5" fill="url(#node)" opacity="1"/>
    <circle cx="45" cy="65" r="4" fill="url(#node)" opacity="0.9"/>
    <circle cx="30" cy="75" r="3" fill="url(#node)" opacity="0.8"/>

    <!-- Connection lines -->
    <line x1="25" y1="35" x2="35" y2="45" stroke="#00d2ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="55" y1="35" x2="35" y2="45" stroke="#00d2ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="35" y1="45" x2="20" y2="55" stroke="#7b2ff7" stroke-width="1.5" opacity="0.6"/>
    <line x1="35" y1="45" x2="60" y2="55" stroke="#7b2ff7" stroke-width="1.5" opacity="0.6"/>
    <line x1="35" y1="45" x2="45" y2="65" stroke="#00d2ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="45" y1="65" x2="30" y2="75" stroke="#7b2ff7" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="55" x2="30" y2="75" stroke="#00d2ff" stroke-width="1" opacity="0.4"/>
    <line x1="60" y1="55" x2="45" y2="65" stroke="#00d2ff" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Integration nodes (right side) -->
  <g transform="translate(240, 50)" filter="url(#glow)">
    <!-- Central hub -->
    <circle cx="50" cy="40" r="8" fill="url(#node)" opacity="0.9"/>
    <!-- Outer nodes -->
    <circle cx="20" cy="20" r="5" fill="url(#node)" opacity="0.7"/>
    <circle cx="80" cy="20" r="5" fill="url(#node)" opacity="0.7"/>
    <circle cx="20" cy="60" r="5" fill="url(#node)" opacity="0.7"/>
    <circle cx="80" cy="60" r="5" fill="url(#node)" opacity="0.7"/>
    <circle cx="50" cy="10" r="4" fill="url(#node)" opacity="0.6"/>
    <circle cx="50" cy="70" r="4" fill="url(#node)" opacity="0.6"/>

    <!-- Connection lines -->
    <line x1="50" y1="40" x2="20" y2="20" stroke="#00d2ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="40" x2="80" y2="20" stroke="#7b2ff7" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="40" x2="20" y2="60" stroke="#00d2ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="40" x2="80" y2="60" stroke="#7b2ff7" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="40" x2="50" y2="10" stroke="#00d2ff" stroke-width="1" opacity="0.4"/>
    <line x1="50" y1="40" x2="50" y2="70" stroke="#7b2ff7" stroke-width="1" opacity="0.4"/>

    <!-- Outer ring -->
    <circle cx="50" cy="40" r="35" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  </g>

  <!-- Connecting bridge between brain and integration -->
  <g opacity="0.4">
    <line x1="130" y1="85" x2="240" y2="70" stroke="url(#accent)" stroke-width="1" stroke-dasharray="6,3"/>
    <line x1="130" y1="95" x2="240" y2="90" stroke="url(#accent)" stroke-width="1" stroke-dasharray="6,3"/>
  </g>

  <!-- Title: AI一体化 -->
  <text x="200" y="155" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="28" font-weight="bold" fill="url(#accent)" filter="url(#glow)">
    AI一体化
  </text>

  <!-- Subtitle -->
  <text x="200" y="175" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" fill="#8892b0" letter-spacing="4">
    智能体开发平台
  </text>

  <!-- Signature: 孙朋 -->
  <g transform="translate(320, 165)">
    <rect x="0" y="0" width="60" height="25" rx="3" fill="none" stroke="#00d2ff" stroke-width="0.8" opacity="0.5"/>
    <text x="30" y="17" text-anchor="middle" font-family="'STKaiti', 'KaiTi', 'Microsoft YaHei', serif" font-size="13" fill="#ccd6f6" opacity="0.9">
      孙朋
    </text>
  </g>

  <!-- Version tag -->
  <text x="15" y="190" font-family="monospace" font-size="8" fill="#4a5568" opacity="0.6">
    v1.0.0
  </text>
</svg>